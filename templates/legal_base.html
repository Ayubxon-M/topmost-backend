<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %} — TOPMOST</title>
  <style>
    /* Ilova ranglari: to'q ko'k + moviy. Telefon qorong'i rejimda bo'lsa — sahifa ham qorong'i. */
    :root { --bg: #f4f7fb; --text: #1f2933; --muted: #6b7280; --accent: #0b2545; --line: #06b6d4; --card: #fff; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0f172a; --text: #e2e8f0; --muted: #94a3b8; --accent: #38bdf8; --line: #06b6d4; --card: #1e293b; }
    }
    body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 760px; margin: 0 auto; padding: 24px 16px 48px; }
    h1 { color: var(--accent); margin-bottom: 4px; }
    h2 { margin-top: 32px; font-size: 1.2rem; }
    a { color: var(--accent); }
    .muted { color: var(--muted); font-size: .9rem; }
    .box { background: var(--card); border-left: 4px solid var(--line); padding: 12px 16px; border-radius: 6px; }
    li { margin: 4px 0; }
    nav { margin-top: 40px; font-size: .9rem; }
  </style>
</head>
<body>
<main>
  {% block content %}{% endblock %}
  <nav class="muted"><a href="/privacy/">Maxfiylik siyosati</a> · <a href="/terms/">Foydalanish shartlari</a></nav>
</main>
</body>
</html>
